[tool.poetry]
name = "spriter-python"
version = "1.4.0"
description = "CLI tool for crop sprites in sprite sheets"
authors = ["ifuckingjoke"]

packages = [
    { include = "py-spriter", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
pillow = "^12.2.0"
opencv-python = "^4.13.0.92"

[tool.poetry.scripts]
spriter = "py-spriter.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
